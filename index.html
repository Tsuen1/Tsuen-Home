<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tsuen.net 系统入口，连接解剖学习、疼痛沟通和 GESP C++ 学习考试系统。"
    />
    <title>Tsuen.net 系统入口</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Tsuen.net</p>
          <h1 id="page-title">Tsuen’s 数字系统入口</h1>
          <p class="lead">健康观察、解剖学习、编程训练和家庭知识系统的统一入口。</p>
        </div>

        <div class="status-panel" aria-label="系统概览">
          <div class="status-line">
            <span class="status-dot online"></span>
            <span>解剖系统已上线</span>
          </div>
          <div class="status-line">
            <span class="status-dot pending"></span>
            <span>GESP 考试系统准备中</span>
          </div>
          <div class="status-line">
            <span class="status-dot reserved"></span>
            <span>更多系统预留</span>
          </div>
        </div>
      </section>

      <section class="systems" aria-label="系统入口">
        <a class="system-card anatomy-card" href="https://anatomy.tsuen.net">
          <div class="card-top">
            <span class="badge live">已上线</span>
            <span class="card-code">ANATOMY</span>
          </div>
          <div class="visual anatomy-visual" aria-hidden="true">
            <span class="spine"></span>
            <span class="muscle muscle-a"></span>
            <span class="muscle muscle-b"></span>
            <span class="joint joint-a"></span>
            <span class="joint joint-b"></span>
          </div>
          <h2>Tsuen’s 解剖系统</h2>
          <p>肌骨结构、疼痛区域标注、颈腰骶髂专题。</p>
          <span class="card-action">打开系统</span>
        </a>

        <article class="system-card muted-card">
          <div class="card-top">
            <span class="badge wait">准备中</span>
            <span class="card-code">GESP</span>
          </div>
          <div class="visual code-visual" aria-hidden="true">
            <span>{ }</span>
            <span>for</span>
            <span>if</span>
            <span>++</span>
          </div>
          <h2>GESP C++ 学习考试系统</h2>
          <p>题库、练习、错题、考试记录和学习进度。</p>
          <span class="card-action disabled">等待部署</span>
        </article>

        <article class="system-card muted-card">
          <div class="card-top">
            <span class="badge reserve">预留</span>
            <span class="card-code">NEXT</span>
          </div>
          <div class="visual archive-visual" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <h2>后续系统</h2>
          <p>投资研究、知识库、课程或家庭管理工具。</p>
          <span class="card-action disabled">规划中</span>
        </article>
      </section>
    </main>

    <footer class="footer">
      <span>Tsuen.net</span>
      <span>医学内容仅用于学习和沟通，不替代医生诊断或治疗建议。</span>
    </footer>
  </body>
</html>
